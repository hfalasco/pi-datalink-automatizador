# Tema da pagina - as mesmas cores da marca.
# O Streamlit le este arquivo ANTES de rodar o script, entao as cores de base
# precisam estar aqui. O restante (barra lateral, cartoes, cartelas de numeros,
# caixa do registro) fica no CSS de tema.py.

[theme]
base = "light"
primaryColor = "#1E7E4A"              # COR_DESTAQUE  - sm-green
backgroundColor = "#F2F5F7"           # COR_FUNDO
secondaryBackgroundColor = "#FFFFFF"  # COR_PAINEL
textColor = "#1B2733"                 # COR_TEXTO

[server]
# Teto do servidor para UM arquivo enviado, em MB. Cada pagina tem o seu
# limite, abaixo deste:
#   * Processar planilhas - 50 MB. Templates tem alguns KB; 50 ja e folga.
#   * Tirar formulas - 500 MB. As planilhas ja calculadas pelo PI DataLink
#     chegam a centenas de MB, e o motor delas le o arquivo em pedacos.
# Vale lembrar: o Streamlit guarda na memoria o arquivo enquanto ele esta na
# caixa de envio. Num servidor pequeno (a nuvem gratuita tem por volta de
# 1 GB), poucos envios desse tamanho ao mesmo tempo ja apertam.
maxUploadSize = 500

[browser]
gatherUsageStats = false
